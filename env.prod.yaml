# ============================================
# env.prod.yaml - NON-SECRET production config
# ============================================
# SECRETS are managed via GCP Secret Manager.
# See CHANGES_REPORT.md for the full list of
# secrets to configure in Secret Manager.
# ============================================

USE_VERTEX_AI: "True"
VERTEX_PROJECT_ID: "stellarys-lm"
VERTEX_LOCATION: "us-central1"

DJANGO_DEBUG: "False"
DJANGO_SETTINGS_MODULE: "config.settings"

# C2: Restrict ALLOWED_HOSTS to your Cloud Run domain
ALLOWED_HOSTS: "backend-api-140218503200.us-central1.run.app,localhost"

# C3: CORS - add your frontend domains (comma-separated)
# For a mobile app with no web frontend, this can be empty.
# CORS_ALLOW_ALL_ORIGINS is automatically False in production.
CORS_ALLOWED_ORIGINS: ""

STORAGE_BACKEND: "gcs"
GCS_BUCKET_NAME: "stellarys-lm-prod-davisantos"

QUEUE_BACKEND: "cloud_tasks"
GCP_PROJECT: "stellarys-lm"
GCP_LOCATION: "us-central1"
GCP_QUEUE: "artifact-generation"
GCP_SERVICE_URL: "https://backend-api-140218503200.us-central1.run.app"

VECTOR_DB_BACKEND: "pgvector"

GEMINI_API_KEY: ""

SENDGRID_SENDER: "davisantossousa2@gmail.com"

GUEST_TRIAL_MINUTES: "4320"

# --- BILLING (Google Play) ---
GOOGLE_PLAY_PACKAGE_NAME: "com.stelarysllm.ia"

# --- Sentry (optional, set DSN in Secret Manager) ---
SENTRY_ENVIRONMENT: "production"
SENTRY_TRACES_SAMPLE_RATE: "0.1"
SENTRY_PROFILES_SAMPLE_RATE: "0.1"
